name: Python guardrail checks

on:
  push:
    branches: [main, research-grade-guardrails]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic self-test
        run: python app.py --self-test
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run evaluation harness
        run: python evaluate_guardrails.py --output evaluation/results.json
